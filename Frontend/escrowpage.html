<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopNex: Trusted Nigerian Multi-Vendor Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Icons+Outlined" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        surface: 'var(--surface)',
                        'surface-container': 'var(--surface-container)',
                        primary: 'var(--primary)',
                        'on-surface': 'var(--on-surface-default)',
                        'on-surface-variant': 'var(--on-surface-de-emphasis)'
                    },
                    fontFamily: { sans: ['Google Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        :root {
            --primary: #0b57d0;
            --surface: #ffffff;
            --surface-container: #f0f4f9;
            --on-surface-default: #1b1c1d;
            --on-surface-de-emphasis: #444746;
            --stroke-default: #dcdfe5;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #a8c7fa;
                --surface: #101218;
                --surface-container: #282a2c;
                --on-surface-default: #ffffff;
                --on-surface-de-emphasis: #c4c7c5;
                --stroke-default: #2d2f38;
            }
        }
        body { font-family: 'Google Sans', sans-serif; background-color: var(--surface); color: var(--on-surface-default); -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes slideInUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast-enter { animation: slideInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col transition-colors duration-200 pb-16 md:pb-0">

    <header class="border-b border-[var(--stroke-default)] bg-surface sticky top-0 z-50 transition-colors duration-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3 cursor-pointer" onclick="app.navigate('home')">
                    <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center text-primary font-bold">
                        <span class="material-icons">storefront</span>
                    </div>
                    <div>
                        <h1 class="font-bold text-xl leading-tight tracking-tight">ShopNex</h1>
                        <p class="hidden sm:block text-[10px] text-[var(--on-surface-de-emphasis)] font-medium uppercase tracking-wider">Escrow Protected</p>
                    </div>
                </div>

                <nav class="hidden md:flex items-center space-x-6 ml-8">
                    <button onclick="app.navigate('home')" class="text-sm font-medium hover:text-primary transition">Marketplace</button>
                    <button onclick="app.toggleRole()" id="desktop-role-text" class="text-sm font-medium hover:text-primary transition">Switch Role: Vendor</button>
                </nav>

                <div class="flex items-center space-x-2 sm:space-x-4 ml-auto">
                    <button onclick="app.toggleTheme()" class="p-2 rounded-full hover:bg-[var(--surface-container)] transition">
                        <span class="material-icons-outlined text-xl">dark_mode</span>
                    </button>
                    <button onclick="app.navigate('cart')" class="relative p-2 rounded-full hover:bg-[var(--surface-container)] transition group hidden md:block">
                        <span class="material-icons-outlined text-xl group-hover:text-primary transition">shopping_cart</span>
                        <span id="cart-badge" class="absolute top-0 right-0 bg-red-500 text-white text-[10px] font-bold h-4 w-4 rounded-full flex items-center justify-center transform scale-0 transition-transform">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main id="app-content" class="flex-1 w-full relative"></main>

    <div id="modal-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
        <div id="modal-content" class="bg-surface border border-[var(--stroke-default)] rounded-3xl max-w-md w-full p-6 shadow-2xl transform scale-95 transition-transform duration-200"></div>
    </div>

    <div id="toast-container" class="fixed bottom-20 md:bottom-6 left-1/2 transform -translate-x-1/2 z-[90] flex flex-col items-center space-y-2 pointer-events-none"></div>

    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-surface border-t border-[var(--stroke-default)] z-50 flex justify-around items-center h-16 transition-colors duration-200">
        <button onclick="app.navigate('home')" class="flex flex-col items-center p-2 text-[var(--on-surface-de-emphasis)] hover:text-primary transition" id="nav-mobile-home">
            <span class="material-icons-outlined text-2xl">home</span>
            <span class="text-[10px] font-medium mt-1">Home</span>
        </button>
        <button onclick="app.navigate('cart')" class="relative flex flex-col items-center p-2 text-[var(--on-surface-de-emphasis)] hover:text-primary transition" id="nav-mobile-cart">
            <span class="material-icons-outlined text-2xl">shopping_cart</span>
            <span class="text-[10px] font-medium mt-1">Cart</span>
            <span id="mobile-cart-badge" class="absolute top-1 right-2 bg-red-500 text-white text-[10px] font-bold h-4 w-4 rounded-full flex items-center justify-center transform scale-0 transition-transform">0</span>
        </button>
        <button onclick="app.toggleRole()" class="flex flex-col items-center p-2 text-[var(--on-surface-de-emphasis)] hover:text-primary transition" id="nav-mobile-role">
            <span class="material-icons-outlined text-2xl">swap_horiz</span>
            <span class="text-[10px] font-medium mt-1" id="mobile-role-text">Switch Role</span>
        </button>
    </nav>

    <script>
        const MOCK_VENDORS = [
            { id: 'vendor_01', name: 'ClevaTech Ng', verified: true, avatar: 'https://placehold.co/100x100/0b57d0/ffffff?text=CT' },
            { id: 'v2', name: 'Lagos Fashion Hub', verified: true, avatar: 'https://placehold.co/100x100/146c2e/ffffff?text=LF' }
        ];

        const MOCK_PRODUCTS = [
            { id: 'p1', vendorId: 'vendor_01', name: 'MacBook Pro M2', price: 850000, category: 'Electronics', image: 'https://placehold.co/400x300/f0f4f9/1b1c1d?text=MacBook+Pro' },
            { id: 'p6', vendorId: 'vendor_01', name: 'Sony WH-1000XM5', price: 320000, category: 'Electronics', image: 'https://placehold.co/400x300/f0f4f9/1b1c1d?text=Sony+Audio' }
        ];

        const app = {
            currentView: 'home',
            activeCategory: 'All',
            roles: ['buyer', 'vendor', 'dispatcher'],
            currentRoleIndex: 0,
            cart: [],
            orders: [],
            walletBalanceVendor: 25000.00, 
            walletBalanceDispatcher: 0.00,
            
            formatMoney: (amount) => '₦' + Number(amount).toLocaleString('en-NG'),
            getVendor: (id) => MOCK_VENDORS.find(v => v.id === id),
            getProduct: (id) => MOCK_PRODUCTS.find(p => p.id === id),

            toggleTheme: () => {
                const html = document.documentElement;
                html.classList.toggle('dark');
                localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
            },

            toggleRole: () => {
                app.currentRoleIndex = (app.currentRoleIndex + 1) % app.roles.length;
                const role = app.roles[app.currentRoleIndex];
                
                const desktopMap = { buyer: 'Switch Role: Vendor', vendor: 'Switch Role: Dispatcher', dispatcher: 'Switch Role: Buyer' };
                const mobileMap = { buyer: 'Marketplace', vendor: 'Vendor Hub', dispatcher: 'Dispatch Hub' };
                
                document.getElementById('desktop-role-text').innerText = desktopMap[role];
                document.getElementById('mobile-role-text').innerText = mobileMap[role];
                
                if (role === 'vendor') app.navigate('vendor_dashboard');
                else if (role === 'dispatcher') app.navigate('dispatcher_dashboard');
                else app.navigate('home');
                
                app.showToast(`Role active: ${role.toUpperCase()}`);
            },

            navigate: (view, param = null) => {
                app.currentView = view;
                const contentArea = document.getElementById('app-content');
                contentArea.style.opacity = '0';
                
                setTimeout(() => {
                    switch(view) {
                        case 'home': contentArea.innerHTML = app.renderHome(); break;
                        case 'product': contentArea.innerHTML = app.renderProductDetails(param); break;
                        case 'cart': contentArea.innerHTML = app.renderCart(); break;
                        case 'vendor_dashboard': contentArea.innerHTML = app.renderVendorDashboard(); break;
                        case 'dispatcher_dashboard': contentArea.innerHTML = app.renderDispatcherDashboard(); break;
                    }
                    contentArea.style.opacity = '1';
                    contentArea.style.transition = 'opacity 0.2s ease';
                }, 100);
            },

            // --- UI Rendering Helpers ---
            showToast: (message, isError = false) => {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = `${isError ? 'bg-red-600' : 'bg-[var(--on-surface-default)]'} text-[var(--surface)] px-4 py-2 rounded-full shadow-lg text-sm font-medium toast-enter flex items-center space-x-2`;
                toast.innerHTML = `<span class="material-icons-outlined text-sm">${isError ? 'error_outline' : 'check_circle'}</span><span>${message}</span>`;
                container.appendChild(toast);
                setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
            },

            showModal: (title, bodyHtml, primaryActionText, primaryActionCallback) => {
                const overlay = document.getElementById('modal-overlay');
                const content = document.getElementById('modal-content');
                content.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <h2 class="text-xl font-bold">${title}</h2>
                        <button onclick="app.closeModal()" class="text-[var(--on-surface-de-emphasis)] hover:text-[var(--on-surface-default)]"><span class="material-icons">close</span></button>
                    </div>
                    <div class="text-[var(--on-surface-de-emphasis)] text-sm mb-6 space-y-3">${bodyHtml}</div>
                    <div class="flex justify-end space-x-3">
                        <button onclick="app.closeModal()" class="px-4 py-2 rounded-xl text-sm font-medium hover:bg-[var(--surface-container)] transition">Cancel</button>
                        <button id="modal-primary-btn" class="px-4 py-2 rounded-xl bg-primary text-white text-sm font-medium hover:bg-opacity-90">${primaryActionText}</button>
                    </div>`;
                document.getElementById('modal-primary-btn').onclick = () => { if (primaryActionCallback() !== false) app.closeModal(); };
                overlay.classList.remove('hidden', 'opacity-0');
                content.classList.remove('scale-95');
            },

            closeModal: () => {
                const overlay = document.getElementById('modal-overlay');
                overlay.classList.add('opacity-0');
                document.getElementById('modal-content').classList.add('scale-95');
                setTimeout(() => overlay.classList.add('hidden'), 200);
            },

            addToCart: (productId) => {
                const product = app.getProduct(productId);
                const existing = app.cart.find(item => item.product.id === productId);
                if (existing) existing.quantity += 1;
                else app.cart.push({ product, quantity: 1 });
                app.updateCartBadge();
                app.showToast(`${product.name} added to cart`);
            },

            updateCartBadge: () => {
                const totalItems = app.cart.reduce((sum, item) => sum + item.quantity, 0);
                document.getElementById('cart-badge').innerText = totalItems;
                document.getElementById('mobile-cart-badge').innerText = totalItems;
                const scaleClass = totalItems > 0 ? 'scale-100' : 'scale-0';
                document.getElementById('cart-badge').classList.replace(totalItems > 0 ? 'scale-0' : 'scale-100', scaleClass);
            },

            // --- Views ---
            renderHome: () => {
                return `
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                        <div class="relative rounded-3xl overflow-hidden bg-gradient-to-r from-blue-900 to-primary text-white p-8 sm:p-12 shadow-xl flex flex-col md:flex-row items-center justify-between border border-blue-400/30">
                            <div class="md:w-2/3 space-y-4 z-10">
                                <h2 class="text-3xl sm:text-5xl font-bold leading-tight">Zero-Risk Deliveries.</h2>
                                <p class="text-blue-100 text-sm sm:text-base max-w-xl">Funds are split instantly between the vendor and dispatcher only when you provide the delivery PIN.</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                            ${MOCK_PRODUCTS.map(p => `
                                <div class="bg-[var(--surface-container)] rounded-2xl overflow-hidden border border-[var(--stroke-default)] hover:border-primary transition group flex flex-col h-full cursor-pointer" onclick="app.navigate('product', '${p.id}')">
                                    <img src="${p.image}" class="object-cover w-full aspect-[4/3] group-hover:scale-105 transition duration-500">
                                    <div class="p-4 flex flex-col flex-1">
                                        <h3 class="font-bold text-sm leading-snug mb-2 flex-1">${p.name}</h3>
                                        <div class="flex items-end justify-between mt-auto">
                                            <span class="font-bold text-lg">${app.formatMoney(p.price)}</span>
                                            <button onclick="event.stopPropagation(); app.addToCart('${p.id}')" class="w-8 h-8 rounded-full bg-primary/10 text-primary flex items-center justify-center hover:bg-primary hover:text-white"><span class="material-icons-outlined text-[18px]">add_shopping_cart</span></button>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>`;
            },

            renderProductDetails: (productId) => {
                const product = app.getProduct(productId);
                return `
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        <button onclick="app.navigate('home')" class="flex items-center space-x-2 text-[var(--on-surface-de-emphasis)] hover:text-primary transition mb-6"><span class="material-icons text-sm">arrow_back</span><span class="text-sm font-medium">Back</span></button>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                            <img src="${product.image}" class="w-full rounded-3xl border border-[var(--stroke-default)]">
                            <div class="flex flex-col space-y-6">
                                <h1 class="text-3xl font-bold">${product.name}</h1>
                                <div class="text-3xl font-bold">${app.formatMoney(product.price)}</div>
                                <button onclick="app.addToCart('${product.id}')" class="w-full py-4 rounded-2xl bg-primary text-white font-bold text-lg shadow-lg hover:shadow-primary/30">Add to Secure Cart</button>
                            </div>
                        </div>
                    </div>`;
            },

            renderCart: () => {
                if (app.cart.length === 0) return `<div class="text-center py-16"><h2 class="text-2xl font-bold mb-2">Cart empty</h2></div>`;
                const subtotal = app.cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
                const deliveryFee = 15000;
                const platformFee = (subtotal + deliveryFee) * 0.015;
                const total = subtotal + deliveryFee + platformFee;

                return `
                    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div class="lg:col-span-2 bg-[var(--surface-container)] rounded-3xl p-6 border border-[var(--stroke-default)]">
                            ${app.cart.map(item => `
                                <div class="flex items-center py-4 border-b border-[var(--stroke-default)]">
                                    <img src="${item.product.image}" class="w-16 h-16 rounded-xl mr-4 border border-[var(--stroke-default)]">
                                    <div class="flex-1"><h4 class="font-bold text-sm">${item.product.name}</h4><div class="font-bold text-primary">${app.formatMoney(item.product.price)}</div></div>
                                </div>`).join('')}
                        </div>
                        <div class="lg:col-span-1 bg-[var(--surface-container)] rounded-3xl p-6 border border-[var(--stroke-default)] sticky top-24">
                            <h3 class="font-bold text-lg mb-6">Order Summary</h3>
                            <div class="space-y-4 text-sm">
                                <div class="flex justify-between"><span>Items</span><span class="font-bold">${app.formatMoney(subtotal)}</span></div>
                                <div class="flex justify-between"><span>Delivery</span><span class="font-bold">${app.formatMoney(deliveryFee)}</span></div>
                                <div class="flex justify-between"><span>Escrow Fee (1.5%)</span><span class="font-bold">${app.formatMoney(platformFee)}</span></div>
                                <div class="border-t border-[var(--stroke-default)] pt-4 mt-2 flex justify-between"><span class="font-bold">Total Lock</span><span class="font-bold text-xl text-primary">${app.formatMoney(total)}</span></div>
                            </div>
                            <button onclick="app.processCheckout()" class="w-full mt-8 py-3 rounded-xl bg-primary text-white font-bold shadow-lg flex items-center justify-center space-x-2"><span class="material-icons">lock</span><span>Checkout</span></button>
                        </div>
                    </div>`;
            },

            processCheckout: async () => {
                const newCodes = [];
                for (const item of app.cart) {
                    const orderId = "ORD_" + Math.floor(1000 + Math.random() * 9000);
                    try {
                        const response = await fetch('/api/create-order', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ orderId, buyerId: "buyer_01", vendorId: item.product.vendorId, amount: item.product.price })
                        });
                        const result = await response.json();
                        if (!response.ok) throw new Error(result.error);

                        newCodes.push({ name: item.product.name, code: result.releaseCodeForBuyer });
                        app.orders.unshift({ id: orderId, product: item.product, vendorId: item.product.vendorId, dispatcherId: 'd_789', status: 'LOCKED_IN_TRANSIT', code: result.releaseCodeForBuyer, deliveryFee: 15000 });
                    } catch (err) { return app.showToast(err.message, true); }
                }

                app.showModal('Checkout Complete', `
                    <p class="text-center font-bold text-base mb-2">Funds Locked in Vault</p>
                    <p class="text-center text-sm mb-4">Provide these PINs to the Dispatcher upon arrival.</p>
                    ${newCodes.map(c => `<div class="bg-surface p-3 rounded-xl border border-[var(--stroke-default)] mb-2 text-center"><div class="text-xs mb-1">${c.name}</div><div class="font-mono text-xl font-bold text-primary">${c.code}</div></div>`).join('')}
                    <p class="text-xs text-center text-amber-600 mt-4">Switch to "Dispatcher Role" to clear these orders.</p>
                `, 'Done', () => { app.cart = []; app.updateCartBadge(); app.navigate('home'); });
            },

            // --- Vendor Dashboard (View Only) ---
            renderVendorDashboard: () => {
                const vendorOrders = app.orders.filter(o => o.vendorId === 'vendor_01');
                const escrowLocked = vendorOrders.filter(o => o.status === 'LOCKED_IN_TRANSIT').reduce((sum, o) => sum + o.product.price, 0);

                return `
                    <div class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-3 border-b border-[var(--stroke-default)] pb-4"><h2 class="text-2xl font-bold">Vendor Dashboard</h2></div>
                        <div class="lg:col-span-1 space-y-6">
                            <div class="bg-gradient-to-br from-blue-900 to-primary p-6 rounded-2xl text-white">
                                <h3 class="text-sm font-medium opacity-80">Wallet Balance</h3>
                                <div class="text-3xl font-bold mt-1">${app.formatMoney(app.walletBalanceVendor)}</div>
                            </div>
                            <div class="bg-[var(--surface-container)] p-6 rounded-2xl border border-[var(--stroke-default)]">
                                <div class="flex justify-between items-center"><span class="text-sm">Locked in Transit</span><span class="font-bold text-amber-500">${app.formatMoney(escrowLocked)}</span></div>
                            </div>
                        </div>
                        <div class="lg:col-span-2 bg-[var(--surface-container)] p-6 rounded-2xl border border-[var(--stroke-default)] h-full">
                            <h2 class="font-bold text-lg mb-6">Active Dispatches</h2>
                            <div class="space-y-4">
                                ${vendorOrders.length ? vendorOrders.map(order => `
                                    <div class="p-4 rounded-xl bg-surface border border-[var(--stroke-default)] flex justify-between items-center">
                                        <div><div class="text-xs font-semibold text-primary">#${order.id}</div><h3 class="font-bold text-sm">${order.product.name}</h3></div>
                                        <div class="text-right">
                                            <span class="font-bold">${app.formatMoney(order.product.price)}</span>
                                            <div class="text-[10px] font-bold ${order.status === 'LOCKED_IN_TRANSIT' ? 'text-amber-500 bg-amber-500/10' : 'text-emerald-500 bg-emerald-500/10'} px-2 py-1 rounded-lg mt-1 uppercase">${order.status.replace(/_/g, ' ')}</div>
                                        </div>
                                    </div>`).join('') : '<p class="text-sm text-[var(--on-surface-de-emphasis)]">No recent orders.</p>'}
                            </div>
                        </div>
                    </div>`;
            },

            // --- Dispatcher Dashboard (Clearance Input) ---
            renderDispatcherDashboard: () => {
                const dispatchOrders = app.orders.filter(o => o.dispatcherId === 'd_789');
                return `
                    <div class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-3 border-b border-[var(--stroke-default)] pb-4"><h2 class="text-2xl font-bold">Courier Hub</h2><p class="text-sm">Logistics App Simulation</p></div>
                        <div class="lg:col-span-1 bg-gradient-to-br from-emerald-700 to-emerald-500 p-6 rounded-2xl text-white h-max">
                            <h3 class="text-sm font-medium opacity-80">Cleared Delivery Earnings</h3>
                            <div class="text-3xl font-bold mt-1">${app.formatMoney(app.walletBalanceDispatcher)}</div>
                        </div>
                        <div class="lg:col-span-2 bg-[var(--surface-container)] p-6 rounded-2xl border border-[var(--stroke-default)] h-full">
                            <h2 class="font-bold text-lg mb-6">Pending Deliveries</h2>
                            <div class="space-y-4">
                                ${dispatchOrders.length ? dispatchOrders.map(order => `
                                    <div class="p-4 rounded-xl bg-surface border border-[var(--stroke-default)] flex justify-between items-center">
                                        <div><div class="text-xs font-semibold text-primary">#${order.id}</div><h3 class="font-bold text-sm">Delivery Fee: ${app.formatMoney(order.deliveryFee)}</h3></div>
                                        <div class="text-right">
                                            ${order.status === 'LOCKED_IN_TRANSIT' ? 
                                                `<button onclick="app.promptForDispatcherCode('${order.id}')" class="text-xs bg-primary text-white px-4 py-2 rounded-lg font-bold shadow-lg">Enter Buyer PIN</button>` :
                                                `<div class="text-[10px] font-bold text-emerald-500 bg-emerald-500/10 px-2 py-1 rounded-lg uppercase">Cleared</div>`}
                                        </div>
                                    </div>`).join('') : '<p class="text-sm text-[var(--on-surface-de-emphasis)]">No deliveries pending.</p>'}
                            </div>
                        </div>
                    </div>`;
            },

            promptForDispatcherCode: (orderId) => {
                const order = app.orders.find(o => o.id === orderId);
                app.showModal(`Clear Delivery: #${order.id}`, `
                    <p class="mb-4 text-sm">Ask the buyer for their 4-digit Delivery PIN. Submitting this will unlock the vault and route payouts.</p>
                    <input type="text" id="escrow-code-input" class="w-full border border-[var(--stroke-default)] rounded-xl p-3 bg-surface text-center font-mono text-lg font-bold" placeholder="PIN">
                    <p id="code-error-msg" class="text-xs text-red-500 font-medium mt-2 hidden text-center"></p>
                `, 'Clear Order', async () => {
                    const inputVal = document.getElementById('escrow-code-input').value.trim();
                    try {
                        const response = await fetch('/api/release-order', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ orderId: order.id, providedCode: inputVal })
                        });
                        const result = await response.json();
                        if (!response.ok) throw new Error(result.error);

                        order.status = 'DELIVERED_AND_CLEARED';
                        app.walletBalanceVendor += order.product.price;
                        app.walletBalanceDispatcher += order.deliveryFee;
                        
                        app.showToast(`Success! Payouts split to Vendor and Dispatcher.`);
                        app.navigate('dispatcher_dashboard');
                        return true;
                    } catch (err) {
                        document.getElementById('code-error-msg').innerText = err.message;
                        document.getElementById('code-error-msg').classList.remove('hidden');
                        return false;
                    }
                });
            }
        };

        window.onload = () => {
            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
            app.navigate('home');
        };
    </script>
</body>
</html>
